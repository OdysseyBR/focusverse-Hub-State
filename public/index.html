<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TimeLine Focus</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #080808; color: #e0e0e0; min-height: 100vh; }

    /* LOGIN */
    #tela-login {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100vh; gap: 12px;
      background: radial-gradient(ellipse at 50% 0%, #1a0a2e 0%, #080808 70%);
    }
    #tela-login .logo-wrap { margin-bottom: 16px; }
    #tela-login .logo-wrap svg { width: 190px; height: 190px; opacity: 0.95; }
    #tela-login h1 { font-size: 1.8rem; font-weight: 700; color: #ffffff; letter-spacing: -0.03em; }
    #tela-login p { color: #555; font-size: 0.9rem; margin-bottom: 20px; }

    .login-btns { display: flex; flex-direction: column; gap: 10px; width: 280px; }

    .btn-login-google, .btn-login-github {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 12px 20px; border-radius: 10px; font-size: 0.9rem;
      font-weight: 500; cursor: pointer; border: none; transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .btn-login-google {
      background: #ffffff; color: #111;
    }
    .btn-login-google:hover { background: #f0f0f0; transform: translateY(-1px); }
    .btn-login-github {
      background: #161b22; color: #fff; border: 1px solid #30363d;
    }
    .btn-login-github:hover { background: #21262d; transform: translateY(-1px); }

    .divider {
      display: flex; align-items: center; gap: 10px;
      color: #333; font-size: 0.78rem; width: 280px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: #222;
    }

    /* HEADER */
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 32px; background: #0d0d0d;
      border-bottom: 1px solid #1a1a1a; position: sticky; top: 0; z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-left svg { width: 28px; height: 28px; }
    header h1 { font-size: 1rem; font-weight: 600; color: #fff; letter-spacing: -0.02em; }

    #btn-logout {
      background: transparent; color: #555; border: 1px solid #222;
      padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 0.8rem;
      font-family: 'Inter', sans-serif; transition: all 0.2s;
    }
    #btn-logout:hover { color: #fff; border-color: #444; }

    /* CONTEÚDO */
    #conteudo { max-width: 720px; margin: 48px auto; padding: 0 20px; }

    #btn-novo {
      background: #7c3aed; color: #fff; border: none; padding: 10px 20px;
      border-radius: 10px; font-size: 0.88rem; cursor: pointer; font-weight: 600;
      margin-bottom: 36px; font-family: 'Inter', sans-serif; transition: all 0.2s;
      display: flex; align-items: center; gap: 6px;
    }
    #btn-novo:hover { background: #6d28d9; transform: translateY(-1px); }

    /* FORMULÁRIO */
    #formulario {
      background: #0f0f0f; border: 1px solid #1e1e1e; border-radius: 16px;
      padding: 28px; margin-bottom: 36px; display: none; flex-direction: column; gap: 14px;
    }
    #formulario h2 { color: #fff; font-size: 1rem; font-weight: 600; }

    .campo-grupo { display: flex; flex-direction: column; gap: 6px; }
    .campo-grupo label { font-size: 0.75rem; color: #555; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }

    #formulario input, #formulario textarea {
      background: #080808; border: 1px solid #222; color: #e0e0e0;
      padding: 10px 14px; border-radius: 10px; font-size: 0.9rem; width: 100%;
      font-family: 'Inter', sans-serif; transition: border-color 0.2s;
    }
    #formulario input:focus, #formulario textarea:focus {
      outline: none; border-color: #7c3aed;
    }
    #formulario textarea { min-height: 110px; resize: vertical; }

    .form-botoes { display: flex; gap: 10px; padding-top: 4px; }
    #btn-salvar {
      background: #7c3aed; color: #fff; border: none; padding: 10px 22px;
      border-radius: 10px; cursor: pointer; font-weight: 600; font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }
    #btn-salvar:hover { background: #6d28d9; }
    #btn-cancelar {
      background: transparent; color: #555; border: 1px solid #222;
      padding: 10px 22px; border-radius: 10px; cursor: pointer; font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }
    #btn-cancelar:hover { color: #fff; border-color: #444; }

    /* LISTA */
    #lista { display: flex; flex-direction: column; gap: 12px; }

    .evento {
      background: #0f0f0f; border: 1px solid #1a1a1a; border-radius: 16px;
      padding: 22px 26px; transition: border-color 0.2s;
    }
    .evento:hover { border-color: #2a2a2a; }

    .evento-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .evento-info { flex: 1; }
    .evento-data {
      font-size: 0.72rem; color: #7c3aed; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px;
    }
    .evento-titulo { font-size: 1.05rem; color: #fff; font-weight: 600; margin-bottom: 10px; letter-spacing: -0.01em; }
    .evento-descricao { font-size: 0.88rem; color: #666; line-height: 1.7; }

    .evento-botoes { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-editar {
      background: transparent; color: #444; border: 1px solid #1e1e1e;
      padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 0.78rem;
      font-family: 'Inter', sans-serif; transition: all 0.2s;
    }
    .btn-editar:hover { color: #fff; border-color: #444; }
    .btn-deletar {
      background: transparent; color: #6b2020; border: 1px solid #2a1010;
      padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 0.78rem;
      font-family: 'Inter', sans-serif; transition: all 0.2s;
    }
    .btn-deletar:hover { background: #2a1010; color: #ff6b6b; }

    #vazio {
      color: #333; text-align: center; margin-top: 80px; font-size: 0.9rem;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    #vazio span { font-size: 2rem; }
    #carregando { color: #333; text-align: center; margin-top: 80px; font-size: 0.88rem; }
  </style>
</head>

        <input id="campo-data" type="text" placeholder="Ex: Ano 1, Século XV, 2024, 15/03/2024..." />

      <div class="campo-grupo">
        <label>Título</label>
        <input id="campo-titulo" type="text" placeholder="Título do acontecimento" />
      </div>
      <div class="campo-grupo">
        <label>Descrição</label>
        <textarea id="campo-descricao" placeholder="Descreva o acontecimento..."></textarea>
      </div>
      <div class="form-botoes">
        <button id="btn-salvar">Salvar</button>
        <button id="btn-cancelar">Cancelar</button>
      </div>
    </div>

    </div>

    authDomain: "focus-tl.firebaseapp.com",
    projectId: "focus-tl",
    storageBucket: "focus-tl.firebasestorage.app",
    messagingSenderId: "35680912747",
    appId: "1:35680912747:web:6d621434b9c2ef97d3382e"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const auth = getAuth(firebaseApp);
  const googleProvider = new GoogleAuthProvider();
  const githubProvider = new GithubAuthProvider();

  let tokenAtual = null;
  let editandoId = null;

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      tokenAtual = await user.getIdToken();
      document.getElementById('tela-login').style.display = 'none';
      document.getElementById('tela-app').style.display = 'block';
      carregarEventos();
    } else {
      document.getElementById('tela-login').style.display = 'flex';
      document.getElementById('tela-app').style.display = 'none';
    }
  });

  document.getElementById('btn-login-google').addEventListener('click', () => {
    signInWithPopup(auth, googleProvider).catch(console.error);
  });

  document.getElementById('btn-login-github').addEventListener('click', () => {
    signInWithPopup(auth, githubProvider).catch(console.error);
  });

  document.getElementById('btn-logout').addEventListener('click', () => {
    signOut(auth);
  });

  document.getElementById('btn-novo').addEventListener('click', () => {
    editandoId = null;
    document.getElementById('form-titulo').textContent = 'Novo acontecimento';
    document.getElementById('campo-data').value = '';
    document.getElementById('campo-titulo').value = '';
    document.getElementById('campo-descricao').value = '';
    document.getElementById('formulario').style.display = 'flex';
    document.getElementById('formulario').scrollIntoView({ behavior: 'smooth' });
  });

  document.getElementById('btn-cancelar').addEventListener('click', () => {
    document.getElementById('formulario').style.display = 'none';
    editandoId = null;
  });

  document.getElementById('btn-salvar').addEventListener('click', async () => {
    const data = document.getElementById('campo-data').value.trim();
    const titulo = document.getElementById('campo-titulo').value.trim();
    const descricao = document.getElementById('campo-descricao').value.trim();

    if (!data || !titulo || !descricao) {
      alert('Preencha todos os campos!');
      return;
    }

    const url = editandoId ? `/api/eventos/${editandoId}` : '/api/eventos';
    const method = editandoId ? 'PUT' : 'POST';

    await fetch(url, {
      method,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${tokenAtual}`
      },
      body: JSON.stringify({ data, titulo, descricao })
    });

    document.getElementById('formulario').style.display = 'none';
    editandoId = null;
    carregarEventos();
  });

  async function carregarEventos() {
    const res = await fetch('/api/eventos', {
      headers: { 'Authorization': `Bearer ${tokenAtual}` }
    });
    const eventos = await res.json();
    const lista = document.getElementById('lista');

    if (eventos.length === 0) {
      lista.innerHTML = '<div id="vazio"><span>📭</span>Nenhum acontecimento ainda. Crie o primeiro!</div>';
      return;
    }

    lista.innerHTML = eventos.map(e => `
      <div class="evento">
        <div class="evento-header">
          <div class="evento-info">
            <div class="evento-data">${e.data}</div>
            <div class="evento-titulo">${e.titulo}</div>
            <div class="evento-descricao">${e.descricao}</div>
          </div>
          <div class="evento-botoes">
            <button class="btn-editar" onclick="editar('${e.id}', \`${e.data}\`, \`${e.titulo}\`, \`${e.descricao}\`)">Editar</button>
            <button class="btn-deletar" onclick="deletar('${e.id}')">Excluir</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  window.editar = (id, data, titulo, descricao) => {
    editandoId = id;
    document.getElementById('form-titulo').textContent = 'Editar acontecimento';
    document.getElementById('campo-data').value = data;
    document.getElementById('campo-titulo').value = titulo;
    document.getElementById('campo-descricao').value = descricao;
    document.getElementById('formulario').style.display = 'flex';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

// Exportar TXT
  document.getElementById('btn-export-txt').addEventListener('click', async () => {
    const res = await fetch('/api/eventos', {
      headers: { 'Authorization': `Bearer ${tokenAtual}` }
    });
    const eventos = await res.json();

    if (eventos.length === 0) {
      alert('Nenhum acontecimento para exportar!');
      return;
    }

    const linhas = eventos.map(e =>
      `DATA: ${e.data}\nTÍTULO: ${e.titulo}\nDESCRIÇÃO: ${e.descricao}\n${'─'.repeat(50)}`
    ).join('\n\n');

    const conteudo = `Arquivo TimeLine Focus\nExportado em: ${new Date().toLocaleDateString('pt-BR')}\n${'═'.repeat(50)}\n\n${linhas}`;
    const blob = new Blob([conteudo], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'linha-do-tempo.txt';
    a.click();
    URL.revokeObjectURL(url);
  });

  // Exportar PDF
  document.getElementById('btn-export-pdf').addEventListener('click', async () => {
    const res = await fetch('/api/eventos', {
      headers: { 'Authorization': `Bearer ${tokenAtual}` }
    });
    const eventos = await res.json();

    if (eventos.length === 0) {
      alert('Nenhum acontecimento para exportar!');
      return;
    }

    const janela = window.open('', '_blank');
    janela.document.write(`
      <!DOCTYPE html>
      <html>
      <head>
        <meta charset="UTF-8">
        <title>TimeLine Focus</title>
        <style>
          body { font-family: 'Georgia', serif; max-width: 800px; margin: 40px auto; color: #111; padding: 0 20px; }
          h1 { font-size: 2rem; border-bottom: 2px solid #111; padding-bottom: 12px; margin-bottom: 6px; }
          .data-export { color: #888; font-size: 0.85rem; margin-bottom: 40px; }
          .evento { margin-bottom: 36px; padding-bottom: 36px; border-bottom: 1px solid #ddd; }
          .evento:last-child { border-bottom: none; }
          .evento-data { font-size: 0.75rem; color: #7c3aed; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
          .evento-titulo { font-size: 1.3rem; font-weight: 700; margin-bottom: 10px; }
          .evento-descricao { font-size: 0.95rem; color: #444; line-height: 1.8; }
        </style>
      </head>
      <body>
        <h1>Lista Exportada do TimeLine Focus</h1>
        <div class="data-export">Exportado em ${new Date().toLocaleDateString('pt-BR')}</div>
        ${eventos.map(e => `
          <div class="evento">
            <div class="evento-data">${e.data}</div>
            <div class="evento-titulo">${e.titulo}</div>
            <div class="evento-descricao">${e.descricao}</div>
          </div>
        `).join('')}
      </body>
      </html>
    `);
    janela.document.close();
    setTimeout(() => janela.print(), 500);
  });
  
  window.deletar = async (id) => {
    if (!confirm('Tem certeza que quer excluir este acontecimento?')) return;
    await fetch(`/api/eventos/${id}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${tokenAtual}` }
    });
    carregarEventos();
  };
</script>

</body>
</html>
